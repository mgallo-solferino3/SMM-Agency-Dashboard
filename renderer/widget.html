<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self'">
  <title>Agency Dashboard SMM</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
    #bubble {
      position: absolute; inset: 6px;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: transform .12s ease;
    }
    #bubble:hover { transform: scale(1.06); }
    #bubble:active { transform: scale(.96); }
    #bubble img { width: 100%; height: 100%; pointer-events: none; -webkit-user-drag: none; filter: drop-shadow(0 3px 6px rgba(0,0,0,.35)); }
  </style>
</head>
<body>
  <div id="bubble" title="Apri Agency Dashboard SMM"><img src="../build/icon.png" alt=""></div>
  <script src="widget.js"></script>
</body>
</html>

name = "solferino3-dashboard-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Versione web: i file di public/ (creati da scripts/build-web.mjs). Passa prima dal Worker, che chiede la password;
# gli indirizzi /api e /auth sono le API (anche dell'app desktop)
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
# Gli admin possono invitare solo indirizzi di questo dominio
ALLOWED_DOMAIN = "solferino3.it"

[[d1_databases]]
binding = "DB"
database_name = "solferino3-dashboard"
database_id = "43c5f271-0454-4593-ae93-f7e692247ce3"
